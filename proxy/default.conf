# Proxy inverso de LogSentinel: termina TLS y reenvía a la API.
# Este archivo se incluye dentro del contexto `http` de nginx.

# --- Ajustes TLS compartidos ---
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
server_tokens off;
client_max_body_size 64k;

# --- HTTP (8080 en tu PC): solo redirige a HTTPS ---
server {
    listen 80;
    server_name localhost;
    return 301 https://localhost:8443$request_uri;
}

# --- Dashboard (https://localhost:8443): archivos estáticos de React ---
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://localhost:8444; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}

# --- API (https://localhost:8444): proxy hacia el contenedor "api" ---
server {
    listen 444 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    access_log /var/log/nginx/api_access.log;
    error_log  /var/log/nginx/error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        # SOBRESCRIBE X-Forwarded-For: el cliente no puede falsificarlo
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
